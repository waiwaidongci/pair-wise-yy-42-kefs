<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山火事件指挥与伤员后送调度</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem;margin-right:.5rem}</style></head><body><h1>山火事件指挥与伤员后送调度</h1><p>维护火线、风向、资源和任务区，合并离线现场记录并防止人员重复分配。</p><p>伤员按现场编号登记，重复上报沿用首次分诊；发车前按危重、重伤、轻伤排序；已确认批次不打散，运力不足时说明缺口并保留原队列。</p><button onclick="loadItems()">刷新事件</button><button onclick="loadQueue()">待后送队列</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>async function getJson(url){const r=await fetch(url,{headers:{'X-Actor':'demo','X-Role':'viewer'}});return JSON.stringify(await r.json(),null,2)}async function loadItems(){document.getElementById('out').textContent=await getJson('/api/items')}async function loadQueue(){document.getElementById('out').textContent=await getJson('/api/casualties/waiting')}</script></body></html>
